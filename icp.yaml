# yaml-language-server: $schema=https://raw.githubusercontent.com/dfinity/icp-cli/main/docs/schemas/icp-yaml-schema.json
canisters:
  - name: relay
    build:
      steps:
        - type: script
          commands:
            - ./build.sh taggr
            - cp target/wasm32-unknown-unknown/release/taggr.wasm.gz "$ICP_WASM_OUTPUT_PATH"

  - name: bucket
    build:
      steps:
        - type: script
          commands:
            - ./build.sh bucket
            - cp target/wasm32-unknown-unknown/release/bucket.wasm.gz "$ICP_WASM_OUTPUT_PATH"

environments:
  - name: ic
    network: ic
    canisters: [relay, bucket]

  - name: staging
    network: ic
    canisters: [relay, bucket]
